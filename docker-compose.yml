# Self-hosted Space server.
#
# 1. Copy `.env.example` to `.env` and set `SPACE_TOKENS` (compose reads `.env`
#    from this directory automatically).
# 2. `docker compose up -d --build`
# 3. Point the plugin's server settings at this container's URL and token.
#
# The published port defaults to loopback. For use across devices, either put
# the container on a private network (Tailscale/WireGuard) or bind it to the
# private interface only; public exposure must go through a TLS reverse proxy.

services:
  space:
    build: .
    image: alter-dsh-space-server:local
    restart: unless-stopped
    # PID 1 stays a tiny init so signals reach node and orphaned children are reaped.
    init: true
    environment:
      SPACE_DATA_DIR: "${SPACE_DATA_DIR:-/data}"
      SPACE_HOST: "${SPACE_HOST:-0.0.0.0}"
      SPACE_PORT: "${SPACE_PORT:-8787}"
      SPACE_TOKENS: ${SPACE_TOKENS:?set SPACE_TOKENS in .env}
      SPACE_SNAPSHOTS: "${SPACE_SNAPSHOTS:-true}"
    ports:
      - "127.0.0.1:${SPACE_PORT:-8787}:${SPACE_PORT:-8787}"
    volumes:
      - space-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.SPACE_PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  space-data: {}
